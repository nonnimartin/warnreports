server {
  listen 8000;
  listen [::]:8000;

  # https://gist.github.com/tkc/c400263987f1a626e6d9d348b7379caf

  root /srv/vite;
  index index.html;

  location ~* \.(?:manifest|appcache|html?|xml|json)$ {
    expires off;
    etag off;
    access_log off;
    add_header Cache-Control "max-age=86400, public, must-revalidate";
  }

  location ~* \.(?:css|js)$ {
    try_files $uri =404;
    expires off;
    etag off;
    access_log off;
    add_header Cache-Control "max-age=86400, public, must-revalidate";
  }

  # Any route containing a file extension (e.g. /devicesfile.js)
  location ~ ^.+\..+$ {
    try_files $uri =404;
  }

  # Any route that doesn't have a file extension (e.g. /devices)
  location / {
    try_files $uri $uri/ /index.html;
  }
}