<!DOCTYPE html>
<html>
<head>
  <title>Search Page</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/typeahead.js/0.11.1/typeahead.bundle.min.js" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Search Page</h1>
    <input type="text" class="typeahead form-control" placeholder="Search..." />
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/typeahead.js/0.11.1/typeahead.bundle.min.js"></script>
  <script>
    $(document).ready(function() {
      var engine = new Bloodhound({
        remote: {
          url: '/get_companies_like/%QUERY',
          wildcard: '%QUERY',
          transform: function(response) {
            // Convert JSON response to an array of strings
            return JSON.parse(response);
          }
        },
        datumTokenizer: Bloodhound.tokenizers.whitespace,
        queryTokenizer: Bloodhound.tokenizers.whitespace
      });

      $('.typeahead').typeahead({
        hint: true,
        highlight: true,
        minLength: 3
      }, {
        name: 'search-results',
        source: engine,
        templates: {
          suggestion: function(data) {
            return '<p>' + data + '</p>';
          }
        }
      });
    });
  </script>
</body>
</html>
