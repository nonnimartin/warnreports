<!DOCTYPE html>
<html>
<head>
  <title>Search Page</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/typeahead.js/0.11.1/typeahead.bundle.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
      background-color: #fff;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    
    hr.rounded {
      border-top: 8px solid #bbb;
      border-radius: 5px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .typeahead {
      position: relative;
    }

    .typeahead .tt-query {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 4px;
      background-color: #fff;
      transition: border-color 0.3s ease;
    }

    .typeahead .tt-query:focus {
      border-color: #69c;
      outline: none;
    }

    .typeahead .tt-suggestion {
      padding: 8px 12px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
    }

    .typeahead .tt-suggestion:hover,
    .typeahead .tt-suggestion:focus {
      background-color: #6b96a0;
    }

    .tt-menu {
      background-color: #6b96a0;
    }
    .req {
      color: red;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>WARN Notice Subscription Service</h1>
    <form>
      <div class="typeahead">
        <div class="form-group">
          <div><label for="searchCompany">Company: <span class="req">*</span></label></div>
          <input type="text" id="company" class="form-control tt-query" placeholder="Search..." required/>
          <hr class="rounded">
          <div><label for="emailAddress">Email: <span class="req">*</span></label></div>
          <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
        </div>
        <button type="button" class="btn btn-primary" id="submitBtn" disabled="disabled">Submit</button>
      </div>
    </form>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/typeahead.js/0.11.1/typeahead.bundle.min.js"></script>
  <script>
    $(document).ready(function() {

      $('#company, #email').keyup(function() {
        var empty = true;

        if ($('#email').val() && $('#company').val()){
          $('#submitBtn').removeAttr('disabled');
        };

        }
      );
      
      var engine = new Bloodhound({
        remote: {
          url: '/get_companies_like/%QUERY',
          wildcard: '%QUERY',
          transform: function(response) {
            return JSON.parse(response);
          }
        },
        datumTokenizer: Bloodhound.tokenizers.whitespace,
        queryTokenizer: Bloodhound.tokenizers.whitespace
      });

        // Add a click event handler for the submit button
        $('#submitBtn').click(function() {
        var email = $('#email').val();
        var company = $('#company').val();
        
        $.ajax({
          url: '/make_contact',
          method: 'POST',
          data: JSON.stringify({company: company, email: email}),
          contentType: "application/json; charset=utf-8",
          success: function(response) {
            // Handle the API response here
            console.log(response);
          },
          error: function(error) {
            // Handle errors here
            console.error(error);
          }
        });
      });

      $('.tt-query').typeahead({
        hint: true,
        highlight: true,
        minLength: 3
      }, {
        name: 'search-results',
        source: engine,
        templates: {
          suggestion: function(data) {
            return '<p class="tt-suggestion">' + data + '</p>';
          }
        }
      });
    });
  </script>
</body>
</html>
