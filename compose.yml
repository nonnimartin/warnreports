services:

  mongo:
    image: docker.io/mongo
    volumes:
      - mongo:/data/db
      - mongoconfig:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: wrep

  postgres:
    image: docker.io/postgres:alpine
    tmpfs: /tmp
    volumes:
      - postgres:/var/lib/postgresql/data
      - pgadmin:/pgadmin
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: wrep
      POSTGRES_USER: wrep
    command: postgres -F -c logging_collector=off -c listen_addresses='*'

  app:
    image: localhost/warnreports:${APP_IMAGE_TARGET:-dev}
    build:
      context: .
      target: ${APP_IMAGE_TARGET:-}
    volumes:
      - ./build:/build
      - ./build/artifacts:/srv/artifacts
      - .:/code
    ports: [127.0.0.1:8000:8000]
    environment:
      UVICORN_RELOAD: true
      MONGODB_URL: &mongourl ${MOGNODB_URL:-mongodb://root:wrep@mongo:27017/}
      DB_URL: ${DB_URL:-postgresql://wrep@postgres/wrep}
      FRONTEND_DIST: ${FRONTEND_DIST:-/build/dist}
      FRONTEND_AUTO_BUILD: true
    command: ./scripts/wait-for-it.sh -h postgres -p 5432 -t 0 -- sh -c 'wrep migrations migrate --auto-only && python -m wrep.main'
    depends_on: [postgres]

  mongo-express:
    image: docker.io/mongo-express
    ports: [127.0.0.1:8081:8081]
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: wrep
      ME_CONFIG_MONGODB_URL: *mongourl
      ME_CONFIG_BASICAUTH: false
      ME_CONFIG_OPTIONS_FULLWIDTH_LAYOUT: true

  pgadmin:
    image: docker.io/dpage/pgadmin4
    ports: [127.0.0.1:8082:80]
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./extra/servers.json:/pgadmin4/servers.json
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@localhost.example
      PGADMIN_DEFAULT_PASSWORD: pgadmin
      PGADMIN_DISABLE_POSTFIX: 1
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'

volumes:
  mongo:
  mongoconfig:
  postgres:
  pgadmin:
