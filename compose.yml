services:

  mongo:
    image: mongo
    volumes:
      - mongo:/data/db
      - mongoconfig:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: wrep

  mongo-express:
    image: mongo-express
    ports: [127.0.0.1:8081:8081]
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: wrep
      ME_CONFIG_MONGODB_URL: mongodb://root:wrep@mongo:27017/
      ME_CONFIG_BASICAUTH: false

  app:
    image: localhost/warn-reporter:dev
    build:
      context: .
    volumes:
      - ./build:/build
      - .:/code
    ports: [127.0.0.1:8000:8000]
    environment:
      UVICORN_RELOAD: 'true'
      MONGODB_URL: mongodb://root:wrep@mongo:27017/
    depends_on: [mongo]

volumes:
  mongo:
  mongoconfig:
