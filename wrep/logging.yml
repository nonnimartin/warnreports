version: 1
disable_existing_loggers: False
formatters:
  default:
    format: '%(asctime)s %(levelname)s [%(name)s] %(message)s'
  uvicorn:
    # "()": uvicorn.logging.DefaultFormatter
    format: '%(asctime)s %(levelname)s [uvicorn] %(message)s'
  access:
    # "()": uvicorn.logging.AccessFormatter
    format: '%(asctime)s . %(message)s'
handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
  uvicorn:
    formatter: uvicorn
    class: logging.StreamHandler
    stream: ext://sys.stderr
  access:
    formatter: access
    class: logging.StreamHandler
    stream: ext://sys.stdout
loggers:
  uvicorn.error:
    level: INFO
    handlers: [uvicorn]
    propagate: no
  uvicorn.access:
    level: INFO
    handlers: [access]
    propagate: no
  wrep:
    level: INFO
    handlers: [default]
    propagate: no
root:
  level: INFO
  handlers: [default]
  propagate: no